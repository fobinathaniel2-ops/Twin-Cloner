name: Test build
on:
  workflow_dispatch:
  push:
    branches: [ main ]

concurrency:
  group: twin-test-build
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools ndk;29.0.13846066 platforms;android-34 build-tools;34.0.0'

      - run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Name it twin.apk
        run: |
          mkdir out
          cp app/build/outputs/apk/debug/*universal-debug.apk out/twin.apk

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: twin-test-${{ github.run_number }}
          path: out/twin.apk
          if-no-files-found: error

      - name: Upload build metadata
        uses: actions/upload-artifact@v4
        with:
          name: twin-test-metadata-${{ github.run_number }}
          path: |
            app/build/outputs/apk/debug/*.apk
            Bcore/build/outputs/aar/*.aar
          if-no-files-found: warn