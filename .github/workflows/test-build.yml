name: Test build
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply Twin patch
        run: |
          find app/src/main/res -type f \( -name "ic_launcher.*" -o -name "ic_launcher_round.*" \) -delete
          unzip -o twin_patch.zip
          sed -i 's|android:label="Twin"|android:label="Twin" tools:replace="android:label"|' app/src/main/AndroidManifest.xml

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }

      - uses: android-actions/setup-android@v3
        with:
          packages: ''

      - run: sdkmanager "platform-tools" "ndk;29.0.13846066" "platforms;android-34" "build-tools;34.0.0"

      - run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Name it twin.apk
        run: |
          mkdir out
          cp app/build/outputs/apk/debug/*universal-debug.apk out/twin.apk

      - uses: actions/upload-artifact@v4
        with:
          name: twin
          path: out/twin.apk
